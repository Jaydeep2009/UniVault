spring.application.name=univault

# File upload configuration
# Max file size per request (must be >= chunk size)
spring.servlet.multipart.max-file-size=10MB
# Max total request size
spring.servlet.multipart.max-request-size=10MB
# Async request timeout for long-running uploads (in milliseconds)
# 5 minutes = 300000ms (allows time for uploading chunks to cloud storage)
spring.mvc.async.request-timeout=300000

#database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# application.properties ? relevant additions
univault.chunk.size-bytes=4194304
univault.upload.max-retries=3
univault.upload.retry-base-delay-ms=200
univault.mock.failure-rate=0.1
univault.mock.latency-ms=150

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# health monitor (com.univault.health) - all times in ms unless noted
univault.health.check-interval-ms=360000
univault.health.check-initial-delay-ms=30000
univault.health.token-refresh-interval-ms=1800000
univault.health.token-refresh-initial-delay-ms=60000
univault.health.token-refresh-lookahead-minutes=10
univault.health.quota-sync-interval-ms=21600000
univault.health.quota-sync-initial-delay-ms=90000
#univault.health.check-interval-ms=15000
#univault.health.check-initial-delay-ms=5000
#univault.health.token-refresh-interval-ms=15000
#univault.health.token-refresh-initial-delay-ms=5000
#univault.health.quota-sync-interval-ms=15000
#univault.health.quota-sync-initial-delay-ms=5000