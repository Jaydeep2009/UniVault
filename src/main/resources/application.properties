spring.application.name=univault

#database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# application.properties ? relevant additions
univault.chunk.size-bytes=4194304
univault.upload.max-retries=3
univault.upload.retry-base-delay-ms=200
univault.mock.failure-rate=0.1
univault.mock.latency-ms=150
univault.upload.parallelism=4
logging.level.org.springframework.security=DEBUG